name: CI

# Trigger: uruchom się przy każdym pushu i przy każdym pull requeście
# celującym w main — nie tylko na main, żeby feature-branch/PR też dostał
# czerwone/zielone zanim wyląduje.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    # Świeża maszyna wirtualna Ubuntu, wyrzucana po zakończeniu — nic z
    # lokalnego .venv Szymona się tu nie liczy, tylko to co jest w repo.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Ustaw Pythona 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Zainstaluj zależności (w tym dev: pytest, ruff)"
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testy (pytest)
        run: python -m pytest -q
