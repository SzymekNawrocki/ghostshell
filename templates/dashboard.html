<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>GhostShell</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>
  <div class="hud">
    <div class="hud-header">
      <div class="hud-title">GhostShell</div>
      <div class="hud-status">TOOLKIT · ONLINE</div>
    </div>

    <div class="panel">
      <div class="panel-label">OSINT // sherlock — username recon</div>
      <form
        class="scan-form"
        hx-post="/scan/sherlock/ui"
        hx-target="#sherlock-result"
        hx-swap="innerHTML"
        hx-indicator="#sherlock-indicator"
      >
        <input
          type="text"
          name="username"
          placeholder="target username, np. torvalds"
          required
          autocomplete="off"
        >
        <button class="btn" type="submit">Scan</button>
      </form>
      <div id="sherlock-indicator" class="htmx-indicator">
        <span class="blink">&gt;&gt;</span> przeszukuję serwisy (może potrwać kilka minut)...
      </div>
    </div>

    <div id="sherlock-result" class="panel">
      <div class="panel-label">Wynik</div>
      <p style="color: var(--text-dim);">Brak jeszcze żadnego skanu.</p>
    </div>
  </div>
</body>
</html>
