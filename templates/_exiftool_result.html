<div class="panel-label">Wynik</div>
{% if error %}
<div class="error-box">
  [!] Analiza pliku <strong>{{ target }}</strong> nie powiodła się: {{ error }}
</div>
{% else %}
<div class="result-header">
  <span>target: <span class="result-target">{{ target }}</span></span>
</div>
<p style="color: var(--text-dim); font-size: 0.85rem;">
  Wyciągnięto {{ found_count }} pól metadanych.
</p>
{% if results %}
<ul class="hit-list">
  {% for key, value in results.items() %}
  <li>
    <span class="hit-service">{{ key }}</span>
    <span class="hit-url">{{ value }}</span>
  </li>
  {% endfor %}
</ul>
{% endif %}
{% endif %}
